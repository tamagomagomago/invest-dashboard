name: Update investment dashboard

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a dashboard update already succeeded today in JST"
        required: false
        default: "false"
        type: boolean
  schedule:
    # GitHub Actions schedules are UTC and can be delayed or occasionally
    # skipped. Try repeatedly from 17:05 to 19:55 JST on weekdays; the gate
    # job below keeps the actual dashboard update to one successful run per
    # JST day.
    - cron: "5 8 * * 1-5"
    - cron: "15 8 * * 1-5"
    - cron: "25 8 * * 1-5"
    - cron: "35 8 * * 1-5"
    - cron: "45 8 * * 1-5"
    - cron: "55 8 * * 1-5"
    - cron: "5 9 * * 1-5"
    - cron: "15 9 * * 1-5"
    - cron: "25 9 * * 1-5"
    - cron: "35 9 * * 1-5"
    - cron: "45 9 * * 1-5"
    - cron: "55 9 * * 1-5"
    - cron: "5 10 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "25 10 * * 1-5"
    - cron: "35 10 * * 1-5"
    - cron: "45 10 * * 1-5"
    - cron: "55 10 * * 1-5"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether to run today
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Forced manual run: dashboard update will run."
            exit 0
          fi

          today_jst="$(TZ=Asia/Tokyo date +%F)"
          prior_successes="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Update investment dashboard" \
              --limit 40 \
              --json databaseId,conclusion,updatedAt \
              --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion == "success") | select((.updatedAt | fromdateiso8601 + 32400 | strftime("%Y-%m-%d")) == "'"$today_jst"'")] | length'
          )"

          if [ "$prior_successes" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "A successful dashboard update already completed today in JST: $today_jst."
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "No successful dashboard update found today in JST: $today_jst."

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard
        run: python investment/scripts/update_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: investment

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [gate, build, deploy]
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install notification dependency
        run: pip install requests

      - name: Notify LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          DASHBOARD_URL: https://tamagomagomago.github.io/invest-dashboard/
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_STATUS: ${{ needs.build.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
        run: |
          STATUS="$DEPLOY_STATUS"
          if [ "$BUILD_STATUS" != "success" ]; then
            STATUS="$BUILD_STATUS"
          fi
          python investment/scripts/notify_line.py --status "$STATUS" --url "$DASHBOARD_URL" --run-url "$RUN_URL"
